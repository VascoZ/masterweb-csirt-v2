# Nginx di dalam container (HTTP :8080). TLS diterminasi oleh reverse proxy
# di depannya (lihat docs/nginx-host.conf.example) atau load balancer.

# Batas laju (per IP) untuk endpoint yang sering disalahgunakan.
limit_req_zone $binary_remote_addr zone=csirt_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=csirt_report:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=csirt_general:10m rate=10r/s;
limit_req_status 429;

# Teruskan status HTTPS dari reverse proxy TLS di depan container.
map $http_x_forwarded_proto $fastcgi_https {
    default $https;
    https   on;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Bila ada reverse proxy di depan, aktifkan agar $remote_addr = IP klien asli
    # (penting untuk whitelist login & rate limit). Sesuaikan subnetnya.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Tolak semua file tersembunyi (.env, .git, dll.) kecuali /.well-known.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # Aset hasil build Vite: nama file sudah mengandung hash, aman di-cache lama.
    location /build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # File unggahan publik (logo, banner, RFC 2350, panduan, kunci PGP).
    # Hanya ekstensi tertentu yang dilayani dan tidak pernah dieksekusi.
    location ^~ /storage/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        location ~* \.(png|jpe?g|gif|webp|ico|pdf)$ {
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
        location ~* \.asc$ {
            include /etc/nginx/snippets/security-headers.conf;
            default_type text/plain;
            try_files $uri =404;
        }
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    location = /login {
        limit_req zone=csirt_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /aduan {
        limit_req zone=csirt_report burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=csirt_general burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hanya front controller yang boleh dieksekusi.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
