# Header keamanan untuk file statis (respons PHP sudah membawa header dari aplikasi).
# Catatan: add_header di dalam location menimpa add_header dari level server,
# jadi snippet ini di-include di setiap location statis.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
