; Hardening PHP untuk produksi.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

allow_url_fopen = Off
allow_url_include = Off

; Fungsi eksekusi perintah sistem tidak dibutuhkan aplikasi.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source

; Batas unggah: 5 lampiran x 5 MB pada form aduan.
file_uploads = On
upload_max_filesize = 10M
post_max_size = 30M
max_file_uploads = 10
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1

date.timezone = Asia/Jakarta
