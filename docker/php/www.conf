[www]
; Variabel lingkungan Docker (DB_*, APP_KEY, dll.) diteruskan ke PHP.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Worker didaur ulang lebih sering agar state global yang tertinggal tidak bertahan lama.
pm.max_requests = 200

; Hanya file .php yang boleh dieksekusi.
security.limit_extensions = .php

ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
