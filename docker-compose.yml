# Situs CSIRT — Docker Compose (produksi).
#
#   cp .env.docker.example .env      # lalu isi nilai yang ditandai WAJIB
#   docker compose up -d --build
#
# Dokumentasi lengkap: docs/DEPLOY.md

name: csirt

x-app-env: &app-env
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-csirt}
    DB_USERNAME: ${DB_USERNAME:-csirt_app}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
    LOG_CHANNEL: stderr

services:
  app:
    build:
      context: .
      target: app
    image: csirt-app:latest
    <<: *app-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Unggahan publik (logo, banner, PDF, kunci PGP) — juga dibaca Nginx.
      - public-uploads:/var/www/html/storage/app/public
      # Bukti aduan insiden — HANYA untuk container app, tidak pernah dilayani Nginx.
      - private-storage:/var/www/html/storage/app/private
    read_only: true
    tmpfs:
      - /tmp
      - /var/www/html/storage/framework/cache:uid=82,gid=82
      - /var/www/html/storage/framework/views:uid=82,gid=82
      - /var/www/html/storage/framework/sessions:uid=82,gid=82
      - /var/www/html/storage/logs:uid=82,gid=82
      - /var/www/html/bootstrap/cache:uid=82,gid=82
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]

  web:
    build:
      context: .
      target: web
    image: csirt-web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - public-uploads:/var/www/html/storage/app/public:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-csirt}
      MARIADB_USER: ${DB_USERNAME:-csirt_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-name-resolve"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # Database tidak dipublikasikan ke luar; hanya bisa diakses dari jaringan internal.
    networks: [backend]

volumes:
  db-data:
  public-uploads:
  private-storage:

networks:
  backend:
